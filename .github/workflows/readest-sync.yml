name: Readest Sync

on:
  pull_request:
    paths:
      - 'apps/readest-sync/**'
      - 'mk/**'
      - 'tools/check_qt6*.py'
      - 'tools/pocketbook-simulator/**'
      - 'Dockerfile.qt6'
      - '.dockerignore'
      - 'compose.yaml'
      - 'Makefile'
      - 'LICENSE'
      - 'licenses/**'
      - '.github/workflows/readest-sync.yml'
  push:
    branches: [main]
    tags: ['readest-sync/v*']
    paths:
      - 'apps/readest-sync/**'
      - 'mk/**'
      - 'tools/check_qt6*.py'
      - 'tools/pocketbook-simulator/**'
      - 'Dockerfile.qt6'
      - '.dockerignore'
      - 'compose.yaml'
      - 'Makefile'
      - 'LICENSE'
      - 'licenses/**'
      - '.github/workflows/readest-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readest-sync-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build SDK image
        run: docker compose build qt6
      - name: Check core-only host configuration
        run: |
          docker compose run --rm qt6 sh -ec '
            unset CMAKE_TOOLCHAIN_FILE
            cmake -S apps/readest-sync -B build/readest-sync/host-linux -DREADEST_HOST_TESTS=ON -DCMAKE_BUILD_TYPE=Release
            cmake --build build/readest-sync/host-linux --target application-test -j2
            ctest --test-dir build/readest-sync/host-linux -R "^application$" --output-on-failure
          '
      - name: Run complete CTest suite
        run: |
          docker compose run --rm qt6 sh -ec '
            unset CMAKE_TOOLCHAIN_FILE
            cmake -S apps/readest-sync -B build/readest-sync/simulator -DPOCKETBOOK_SIMULATOR=ON -DCMAKE_BUILD_TYPE=Debug
            cmake --build build/readest-sync/simulator -j2
            ctest --test-dir build/readest-sync/simulator --output-on-failure
          '
      - name: Build PocketBook binary and check ARM ABI
        run: docker compose run --rm qt6 make APP=readest-sync check
      - name: Package installable ZIP
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          revision=$(git rev-parse HEAD)
          version="dev-${revision:0:12}"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" == readest-sync/v* ]]; then
            version="${REF_NAME#readest-sync/}"
          fi
          docker compose run --rm -e VERSION="$version" -e REVISION="$revision" qt6 sh -ec '
            python3 apps/readest-sync/tools/package_release.py --version "$VERSION" --commit "$REVISION" --output build/release
            cp apps/readest-sync/release/README.md build/release/README.md
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readest-sync-pocketbook
          path: build/release/
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/readest-sync/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: readest-sync-pocketbook
          path: release
      - name: Create draft release for device validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.zip release/*.sha256 \
            --verify-tag --draft --latest=false \
            --title "Readest Sync ${RELEASE_TAG#readest-sync/}" \
            --notes-file release/README.md
